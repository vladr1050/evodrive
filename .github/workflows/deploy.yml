# Deploy to production VPS after Tests succeed on main.
# Requires secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key), optional DEPLOY_PATH.

name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches: [main]
  workflow_dispatch: {}   # Ручной запуск: Actions → Deploy → Run workflow

# One deploy at a time — overlapping `compose up` leaves rename leftovers and name conflicts.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy summary (commit info)
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            {
              echo "## Deployed commit"
              echo "- **SHA:** \`$HEAD_SHA\`"
              echo "- **Branch:** $HEAD_BRANCH"
              echo "- **Message:** $DISPLAY_TITLE"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Manual deploy"
              echo "Deploy triggered manually. Server will pull latest \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "::error::Add secret DEPLOY_HOST (e.g. 89.167.74.32) in Settings → Secrets → Actions"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "::error::Add secret DEPLOY_USER (e.g. root)"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then echo "::error::Add secret DEPLOY_SSH_KEY (private key for SSH to server)"; exit 1; fi
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$APP_DIR" ]; then APP_DIR=/var/www/evodrive; fi
            cd "$APP_DIR"
            GIT_SSH_COMMAND="ssh -i /root/.ssh/evodrive_deploy -o StrictHostKeyChecking=no" git fetch origin && git reset --hard origin/main
            docker compose build --no-cache app
            # Interrupted recreates leave names like "<id>_evodrive-app-1" that block the next `up -d`.
            docker compose stop app || true
            docker ps -aq --filter name=evodrive-app | while read -r id; do docker rm -f "$id" || true; done
            docker compose up -d --remove-orphans
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan storage:link || true
            docker compose exec -T app sh -c 'mkdir -p /shared/public && rm -f /shared/public/storage && ln -sf /var/www/html/storage/app/public /shared/public/storage'
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose restart queue scheduler
            echo "Deploy finished."
